name: Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"
          cache-disabled: true

      - name: Verify canonical version state
        shell: bash
        run: bash tools/release/verify-version-state.sh

      - name: Verify published app update manifest
        shell: bash
        run: python3 tools/release/verify-app-update-manifest.py

      - name: Test, lint and build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk Enquadra-release-unsigned.apk
          bash tools/release/verify-version-state.sh Enquadra-release-unsigned.apk
          sha256sum Enquadra-release-unsigned.apk > Enquadra-release-unsigned.apk.sha256

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enquadra-release-candidate-unsigned
          path: |
            Enquadra-release-unsigned.apk
            Enquadra-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 7
