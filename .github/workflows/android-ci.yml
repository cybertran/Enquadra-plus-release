name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Android source
        id: detect
        shell: bash
        run: |
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "Código Android ainda não importado; apenas o bootstrap será validado."
          fi

      - name: Set up JDK 17
        if: steps.detect.outputs.android == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK packages
        if: steps.detect.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        if: steps.detect.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"
          cache-disabled: true

      - name: Verify canonical version state
        if: steps.detect.outputs.android == 'true'
        shell: bash
        run: bash tools/release/verify-version-state.sh

      - name: Verify published app update manifest
        if: steps.detect.outputs.android == 'true'
        shell: bash
        run: python3 tools/release/verify-app-update-manifest.py

      - name: Test, lint and build
        if: steps.detect.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug
