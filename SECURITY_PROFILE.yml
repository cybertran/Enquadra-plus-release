security:
  baseline: enabled
  baseline_version: "1.1"
  baseline_source: "cybertran/Dev-references"
  asvs_version: "5.0.0"
  asvs_target: "L2-applicable"
  profile: "mobile_local_open_source"
  fail_closed: true
  scope:
    repository: "cybertran/Enquadra-plus-release"
    public_repository: true
    authentication_or_remote_api: false
    private_or_sensitive_local_data: true
    public_web_surface: false
    official_signing_key_in_repository: false
    ci_release_signing_enabled: false
  required_gates:
    - security_policy
    - secret_scan
    - dependency_review
    - codeql_when_source_present
    - tests_when_source_present
    - build_when_source_present
    - lint_when_source_present
  block_release_on:
    - critical
    - high
  ai_generated_code:
    trust: false
    validation_required: true
    direct_main_branch_changes: false
    adversarial_review_required: true
  accepted_risk:
    requires_human_approval: true
